name: 2시간 주기 뉴스 자동 수집 및 배포 (GitHub Actions)

on:
  schedule:
    # KST 스마트 가변 주기 (주간 2시간 / 야간 4시간)
    # KST 02:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00
    # = UTC 17, 21, 23, 1, 3, 5, 7, 9, 11, 13시 5분
    - cron: '5 1,3,5,7,9,11,13,17,21,23 * * *'
  workflow_dispatch: # UI / Cloudflare Worker / API 수동·자동 트리거

permissions:
  contents: write

# 중복 크롤·동시 푸시 충돌 방지 (진행 중이면 대기 후 1개만 유지)
concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # schedule/dispatch 모두 푸시 가능하도록 토큰 명시
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 뉴스 크롤링 및 articles.json / sitemap.xml 빌드
        run: python build_data.py

      - name: 빌드 결과 검증
        run: |
          python - <<'PY'
          import json, sys
          with open("articles.json", encoding="utf-8") as f:
              data = json.load(f)
          updated = data.get("updated_at", "")
          total = data.get("total_count", len(data.get("articles", [])))
          print(f"updated_at={updated} total_count={total}")
          if total <= 0:
              print("경고: 기사 0건 — 크롤 실패 가능", file=sys.stderr)
              sys.exit(1)
          PY

      - name: 변경된 데이터 커밋 & 푸시 (Cloudflare Pages 재배포 트리거)
        env:
          RETRY_MAX: 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # news.db 는 .gitignore 대상(로컬/CI 캐시용). 배포 산출물은 JSON/sitemap 만.
          git add articles.json sitemap.xml

          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
            exit 0
          fi

          git commit -m "auto: 2시간 주기 정기 뉴스 데이터 자동 수집 및 갱신 [skip ci]"

          # 원격이 앞서 있을 때 rebase 후 재시도 (동시 실행/수동 푸시 대비)
          n=0
          until [ "$n" -ge "$RETRY_MAX" ]; do
            if git push origin HEAD:main; then
              echo "푸시 성공"
              exit 0
            fi
            n=$((n + 1))
            echo "푸시 실패 (${n}/${RETRY_MAX}), pull --rebase 후 재시도..."
            git pull --rebase origin main || true
            sleep 5
          done
          echo "푸시 최종 실패"
          exit 1
